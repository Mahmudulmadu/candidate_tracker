<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Tracker — starting</title>
<!-- Served by nginx when uvicorn is not answering: during the few seconds
     after a reboot, and for as long as a failed deploy takes to notice.
     The refresh means nobody has to know to press reload. -->
<meta http-equiv="refresh" content="5">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #0a0b11;
    background-image:
      radial-gradient(1200px 620px at 78% -12%, rgba(99,102,241,.16), transparent 62%),
      radial-gradient(900px 520px at 8% 0%, rgba(14,165,233,.10), transparent 58%);
    color: #e9eaf2;
    font: 400 14px/1.55 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 24px;
  }
  .box {
    max-width: 440px; width: 100%; text-align: center;
    background: #12141d; border: 1px solid #262a3a; border-radius: 14px;
    padding: 40px 32px;
    box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 24px 64px rgba(0,0,0,.5);
  }
  .mark {
    width: 44px; height: 44px; margin: 0 auto 20px; padding: 10px;
    border-radius: 12px; color: #fff;
    background: linear-gradient(140deg, #6366f1, #8b5cf6 55%, #0ea5e9);
    box-shadow: 0 3px 14px rgba(99,102,241,.26);
  }
  .mark svg { width: 100%; height: 100%; display: block; }
  h1 { margin: 0 0 8px; font-size: 17px; font-weight: 650; letter-spacing: -.015em; }
  p { margin: 0; color: #9aa0b5; font-size: 13px; }
  .spin {
    width: 22px; height: 22px; margin: 22px auto 0;
    border: 2px solid #262a3a; border-top-color: #818cf8;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint {
    margin-top: 24px; padding-top: 18px; border-top: 1px solid #1e2230;
    font-size: 11.5px; color: #666c82;
  }
  code {
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    font-size: 11px; color: #9aa0b5;
  }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 11l-3 3-2-2"></path>
      </svg>
    </div>
    <h1>Interview Tracker is starting</h1>
    <p>This page refreshes itself — nothing to do but wait a moment.</p>
    <div class="spin"></div>
    <div class="hint">
      Still here after a minute? On the server:<br>
      <code>journalctl -u resume-filter -n 50</code>
    </div>
  </div>
</body>
</html>
