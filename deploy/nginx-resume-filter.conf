# Interview Tracker — nginx front end.
#
# uvicorn binds 127.0.0.1 only, so this is the single way in and port 80 is
# the only one that has to be open on the machine.

upstream resume_filter {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # MAX_CV_MB is 15; the headroom covers multipart overhead, so an
    # oversized upload gets the app's own readable error rather than
    # nginx's bare 413 page.
    client_max_body_size 25M;
    client_body_timeout 120s;

    access_log /var/log/nginx/resume-filter.access.log;
    error_log  /var/log/nginx/resume-filter.error.log;

    # Hide the version on error pages.
    server_tokens off;

    # This is an internal tool with no public pages; keep it out of any
    # crawler that finds its way onto the office network.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # uvicorn takes a few seconds longer to come up than nginx does, so
    # every reboot has a window where the app is not answering yet. A bare
    # "502 Bad Gateway" reads as a broken server; this says what is actually
    # happening and refreshes itself.
    error_page 502 503 504 /__starting.html;
    location = /__starting.html {
        root /var/www/resume-filter;
        internal;
    }

    location / {
        proxy_pass http://resume_filter;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # OCR on a scanned CV downloads models on first use and can run for
        # well over a minute. The default 60s would cut it off and report a
        # gateway error for something that was about to succeed.
        proxy_connect_timeout 10s;
        proxy_send_timeout   180s;
        proxy_read_timeout   180s;

        # An upload should reach the app as it arrives, so its own size
        # check answers rather than nginx buffering the whole file first.
        proxy_request_buffering off;
    }

    # The UI is three static files served by the app itself. They change
    # only on a deploy, so a short cache is safe and keeps a page load off
    # the Python process entirely.
    location ~* \.(css|js|svg|ico|woff2?)$ {
        proxy_pass http://resume_filter;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1h;
        add_header Cache-Control "public";
    }
}
